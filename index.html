/* =========================================================
   HARISSE ENGLISH ACADEMY — ATTACHED REFERENCE DESIGN
   Visual theme only. Application logic and features are retained.
   ========================================================= */
:root{
  --hot-pink:#ec1766;
  --hot-pink-2:#f72c7b;
  --pink:#ffb7d2;
  --pink-2:#f7c7dc;
  --powder-pink:#fde3ee;
  --light-pink:#fff0f6;
  --pale-pink:#fff7fb;
  --white:#ffffff;
  --navy:#1d2940;
  --navy-2:#273650;
  --line:#f3c9dc;
  --line-2:#f7dce8;
  --muted:#56627a;
  --danger:#d94b68;
  --shadow:0 12px 30px rgba(147,29,79,.12);
  --deep-shadow:0 18px 45px rgba(147,29,79,.16);
  /* Legacy variable aliases kept so existing layout rules remain functional. */
  --teal:var(--hot-pink-2);--teal2:var(--hot-pink);--cyan:var(--light-pink);
  --pink:var(--hot-pink-2);--pink2:var(--pink);--cream:var(--pale-pink);
  --raspberry:var(--hot-pink);--mint:var(--powder-pink);--sage:var(--powder-pink);
  --baby-blue:var(--light-pink);--baby-blue-border:var(--line);--baby-blue-dark:var(--hot-pink);
  --baby-blue-light:var(--pale-pink);--purple:var(--pink);--purple-dark:var(--hot-pink);
  --purple-light:var(--powder-pink);--forest:var(--navy);--forest-deep:var(--navy);
  --forest-2:var(--navy-2);--emerald:var(--hot-pink);--green-line:var(--line);
  --green-line-2:var(--line-2);--text-green:var(--navy);--muted-green:var(--muted);
  --main-peach:var(--pink);--main-peach-light:var(--light-pink);--main-peach-deep:var(--pink-2);
  --ref-bg:var(--pale-pink);--ref-danger:var(--danger);--ref-muted:var(--muted);
  --ref-navy:var(--navy);--ref-peach:var(--pink);--ref-pink:var(--hot-pink-2);
  --ref-pink-soft:var(--powder-pink);--ref-rose:var(--hot-pink-2);--ref-rose-dark:var(--hot-pink);
  --ref-text:var(--navy);--jg-border:var(--line);--jg-green:var(--hot-pink);
  --jg-green-dark:var(--hot-pink);--jg-navy:var(--navy);--jg-pink-deep:var(--hot-pink);
  --ink:var(--navy);--txt:var(--navy);--bd:var(--line);--dp:var(--pink);--dp2:var(--hot-pink);
  --lp:var(--light-pink);--lpx:var(--powder-pink);
}

html{
  background:var(--pink);
  min-height:100%;
}
body{
  margin:0;
  min-height:100vh;
  color:var(--navy);
  font-family:Arial,Helvetica,sans-serif !important;
  font-style:normal !important;
  background:
    radial-gradient(circle at 3% 5%,rgba(255,255,255,.72) 0 9%,transparent 27%),
    radial-gradient(circle at 96% 7%,rgba(255,183,210,.46) 0 10%,transparent 28%),
    linear-gradient(135deg,#ffb7d2 0%,#ffdbea 42%,#fff0f6 100%);
}
body *{
  font-family:Arial,Helvetica,sans-serif !important;
  font-style:normal !important;
}
button,input,select,textarea{font-family:Arial,Helvetica,sans-serif !important}
.app{
  grid-template-columns:332px minmax(0,1fr);
  gap:16px;
  padding:14px 16px 16px;
}
.app,.sidebar,main,.panel,.hero,.calendar-wrap{position:relative}

/* Sidebar */
.sidebar{
  background:
    radial-gradient(circle at 50% 0%,rgba(255,255,255,.62),transparent 23%),
    linear-gradient(180deg,#ffdbea 0%,#ffd1e3 52%,#ffbfd8 100%);
  border:1px solid rgba(255,255,255,.95) !important;
  border-radius:23px;
  padding:15px 18px;
  color:var(--navy);
  box-shadow:var(--deep-shadow) !important;
  overflow:hidden;
}
.sidebar::before{
  content:"";
  position:absolute;
  top:24px;
  left:28px;
  width:54px;
  height:27px;
  border-radius:65% 25% 65% 25%;
  background:var(--hot-pink) !important;
  transform:rotate(-13deg);
  box-shadow:30px 9px 0 -2px var(--pink-2);
  pointer-events:none;
}
.sidebar::after{
  content:"♥";
  position:absolute;
  right:18px;
  top:84px;
  color:#f39ab9 !important;
  font-size:34px;
  transform:rotate(14deg);
  pointer-events:none;
}
.brand{
  background:transparent !important;
  padding:2px 0 8px;
  text-align:center;
  position:relative;
  z-index:1;
}
.brand h1{
  font-size:39px !important;
  line-height:.98;
  letter-spacing:-1.2px;
  color:var(--hot-pink) !important;
  text-shadow:0 2px 0 rgba(255,255,255,.72) !important;
  margin:48px 0 8px;
  font-weight:900;
}
.brand h1 .brand-pink{color:var(--hot-pink) !important}
.brand h1 .brand-navy{color:var(--navy) !important}
.brand h1::after{content:none !important}
.brand-ribbon{
  position:relative;
  display:block;
  width:150px;
  height:18px;
  margin:-2px auto 7px;
  background:var(--hot-pink-2);
  border-radius:4px;
  box-shadow:0 3px 7px rgba(147,29,79,.12);
}
.brand-ribbon::before,.brand-ribbon::after{
  content:"";
  position:absolute;
  top:0;
  width:30px;
  height:28px;
  background:var(--hot-pink);
  z-index:-1;
}
.brand-ribbon::before{
  left:-21px;
  clip-path:polygon(100% 0,0 0,35% 50%,0 100%,100% 100%,72% 50%);
  transform:rotate(-2deg);
}
.brand-ribbon::after{
  right:-21px;
  clip-path:polygon(0 0,100% 0,65% 50%,100% 100%,0 100%,28% 50%);
  transform:rotate(2deg);
}
.brand-ribbon span{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:30px;
  height:30px;
  border-radius:50%;
  background:#fff;
  border:4px solid var(--hot-pink);
  box-shadow:0 2px 5px rgba(147,29,79,.10);
}
.brand p{
  display:inline-block;
  background:var(--hot-pink-2) !important;
  color:#fff !important;
  border-radius:999px;
  padding:8px 22px;
  margin:2px 0 1px;
  font-size:15px;
  font-weight:900;
  box-shadow:0 3px 8px rgba(147,29,79,.10) !important;
}
.teacher-card{
  background:rgba(255,255,255,.98) !important;
  border:4px solid #fff !important;
  border-radius:21px;
  padding:7px;
  color:var(--navy);
  box-shadow:0 8px 22px rgba(147,29,79,.10) !important;
}
.teacher-photo,.photo-placeholder{height:195px;border-radius:15px}
.teacher-photo{background:var(--light-pink) !important}
.photo-placeholder{
  background:linear-gradient(135deg,#ffe7f1,#fff7fb) !important;
  color:var(--hot-pink) !important;
}
.bible-verse{color:var(--navy) !important;margin:9px 5px 5px}
.bible-verse strong{color:var(--hot-pink) !important}
.bible-verse span{font-size:18px;font-weight:800;line-height:1.12;color:var(--hot-pink) !important}
.bible-verse span::after{content:"";display:none}
.photo-actions{gap:7px;margin-top:9px}
.photo-actions button{
  min-height:45px;
  border-radius:11px;
  border:1px solid #f2b8cf !important;
  color:var(--hot-pink) !important;
  background:#fff !important;
  font-weight:800;
}
.photo-actions .upload{
  background:var(--hot-pink-2) !important;
  border-color:var(--hot-pink-2) !important;
  color:#fff !important;
}
.nav{gap:7px;padding-top:4px}
.nav button{
  color:var(--navy) !important;
  border:1px solid rgba(255,255,255,.95) !important;
  border-radius:999px;
  font-size:16px;
  padding:10px 17px;
  font-weight:900;
  background:#fff !important;
  box-shadow:0 3px 8px rgba(147,29,79,.07) !important;
  text-shadow:none !important;
}
.nav button:nth-child(1){background:#fff !important}
.nav button:nth-child(2),
.nav button:nth-child(3),
.nav button:nth-child(4),
.nav button:nth-child(5),
.nav button:nth-child(6),
.nav button:nth-child(7){background:var(--light-pink) !important}
.nav button:hover{transform:translateX(1px);background:#fff !important}
.nav button.active{
  background:var(--hot-pink-2) !important;
  color:#fff !important;
  border:2px solid var(--hot-pink-2) !important;
  box-shadow:0 4px 11px rgba(236,23,102,.18) !important;
}
.sidebar-inspiration{position:relative;z-index:1}
.inspiration-lines{color:var(--hot-pink) !important}
.inspiration-heart{color:#f48eae !important}
.leaf-deco{color:#f4a5c1 !important}
.sidebar-note{color:var(--navy) !important}

/* Main shell */
main{
  background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(255,248,252,.98)) !important;
  border:1px solid rgba(255,255,255,.96) !important;
  border-radius:25px;
  padding:15px 16px 20px;
  box-shadow:var(--deep-shadow) !important;
  min-width:0;
}
main::before{
  content:"❧";
  position:absolute;
  right:22px;
  top:4px;
  color:rgba(236,23,102,.12) !important;
  font-size:76px;
  transform:rotate(-12deg);
  pointer-events:none;
}
main::after{
  content:"♥";
  position:absolute;
  right:18px;
  bottom:8px;
  color:rgba(247,44,123,.20) !important;
  font-size:54px;
  pointer-events:none;
}
.top{padding:2px 13px 14px;align-items:center}
.title{
  font-size:40px !important;
  line-height:1;
  color:var(--navy) !important;
  letter-spacing:-1px;
  margin:0;
  font-weight:900;
}
.title .brand-pink{color:var(--hot-pink) !important}
.title .brand-navy{color:var(--navy) !important}
.title::after{content:none !important}
.sub{color:var(--navy) !important;font-size:15px}
.clock{
  min-width:355px;

  border-radius:18px;

}
.clock small{color:var(--navy) !important;font-size:14px}
.clock strong{color:var(--navy) !important;font-size:18px}

/* Welcome banner */
.hero-reference{
  min-height:96px;
  background:
    radial-gradient(circle at 92% 25%,rgba(255,183,210,.42),transparent 22%),
    linear-gradient(135deg,#fff0f6,#ffddea) !important;
  border:1px solid #f3c2d8 !important;
  border-radius:20px;
  padding:15px 26px;
  overflow:hidden;
}
.hero-reference::after{
  content:"♥";
  position:absolute;
  right:165px;
  top:8px;
  color:#f58fb1 !important;
  font-size:35px;
  transform:rotate(14deg);
}
.hero-sun{
  font-size:0 !important;
  width:74px;
  min-width:74px;
  height:74px;
  border-radius:22px;

}
.hero-sun::before{
  content:"";
  position:absolute;
  left:18px;
  top:12px;
  width:20px;
  height:20px;
  border-radius:50%;
  background:var(--hot-pink) !important;
  box-shadow:27px 0 0 var(--hot-pink),13px 20px 0 var(--hot-pink);
}

  content:"";
  position:absolute;
  left:8px;
  top:37px;
  width:58px;
  height:23px;
  border-radius:18px 18px 7px 7px;
  background:var(--hot-pink) !important;
}
.hero-copy{min-width:0}
.hero-reference h2{
  color:var(--hot-pink) !important;
  font-size:30px;
  margin:0;
  font-weight:900;
}
.hero-reference .sub{color:var(--navy) !important}

/* Section headings */
.section-heading{display:flex;align-items:center;gap:10px}
.section-heading h2{
  color:var(--hot-pink) !important;
  font-size:28px;
  font-weight:900;
}
.section-icon{
  color:var(--hot-pink) !important;
  font-size:32px;
  font-weight:900;
  line-height:1;
}
.today-heading .section-icon{font-size:36px}
.badge{
  background:var(--hot-pink-2) !important;
  border:1px solid var(--hot-pink-2) !important;
  color:#fff !important;
  border-radius:999px;
  padding:7px 15px;
  font-size:13px;
  font-weight:900;
}

/* Panels / cards */
.panel{
  background:#fff !important;
  border:1px solid var(--line) !important;
  border-radius:22px;
  padding:16px 20px;
  margin-bottom:15px;
  box-shadow:0 6px 18px rgba(147,29,79,.07) !important;
}
.stats{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{
  min-height:88px;
  background:linear-gradient(135deg,#fff0f6,#fff) !important;
  border:1px solid #f5d2e1 !important;
  border-radius:15px;
  padding:11px 13px;
  display:flex;
  align-items:center;
  gap:11px;
  box-shadow:0 3px 9px rgba(147,29,79,.05) !important;
}
.stat>div{min-width:0}
.stat-icon{
  display:flex !important;
  width:52px;
  min-width:52px;
  height:52px;
  align-items:center;
  justify-content:center;
  border-radius:14px;
  font-size:28px !important;
  font-weight:900;
  color:var(--hot-pink) !important;
  background:#ffe0ec !important;
  margin:0 !important;
}
.stat span:not(.stat-icon){font-size:12px;color:var(--navy) !important}
.stat b{font-size:25px;color:#111827 !important;margin-top:4px}
.stat-rose,.stat-peach,.stat-mint,.stat-sky,.stat-lavender,.stat-yellow{
  background:linear-gradient(135deg,#fff0f6,#fff) !important;
}
.stat-rose .stat-icon,.stat-peach .stat-icon,.stat-mint .stat-icon,
.stat-sky .stat-icon,.stat-lavender .stat-icon,.stat-yellow .stat-icon{
  background:#ffe0ec !important;
  color:var(--hot-pink) !important;
}

/* Buttons */
.primary,.secondary,.ghost,.danger{border-radius:11px;padding:10px 14px;font-weight:800}
.primary{
  background:var(--hot-pink-2) !important;
  border-color:var(--hot-pink-2) !important;
  color:#fff !important;
}
.secondary{
  background:var(--powder-pink) !important;
  border-color:#efb9d0 !important;
  color:var(--hot-pink) !important;
}
.ghost{
  background:#fff !important;
  border-color:#efbdd4 !important;
  color:var(--navy) !important;
}
.danger{
  background:var(--danger) !important;
  border-color:var(--danger) !important;
  color:#fff !important;
}
.mini{
  border:1px solid #efbdd4 !important;
  background:#fff !important;
  color:var(--navy) !important;
}
.mini.del{color:var(--danger) !important}
.notice{
  background:#fff0f6 !important;
  border:1px solid #f3c9dc !important;
  color:var(--navy) !important;
}

/* Tables */
.table{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:720px}
th,td{border-bottom:1px solid var(--line-2) !important}
th{
  background:#ffddea !important;
  color:var(--hot-pink) !important;
  font-weight:900;
}
td{color:var(--navy) !important}
tr:hover td{background:#fff7fb !important}
.badge{box-shadow:none !important}
.empty{color:#8b6b79 !important}

/* Forms */
.field{
  border:1px solid #efbdd4 !important;
  color:var(--navy) !important;
  background:#fff !important;
}
.field:focus{
  border-color:var(--hot-pink) !important;
  box-shadow:0 0 0 3px rgba(236,23,102,.12) !important;
}
.profile-item{
  background:#fff8fb !important;
  border:1px solid var(--line) !important;
  color:var(--navy) !important;
}
.profile-item small{color:var(--muted) !important}
.student-photo-box{
  background:linear-gradient(135deg,#fff5f9,#fff) !important;
  border:1px solid var(--line) !important;
}
.student-photo-placeholder{
  background:#ffe4ef !important;
  color:var(--hot-pink) !important;
}
.student-photo-actions button{
  border:1px solid #efbdd4 !important;
  background:#fff !important;
  color:var(--hot-pink) !important;
}
.student-photo-actions .remove{color:var(--danger) !important}

/* Modals / toast */
.modal-bg{background:rgba(29,41,64,.48) !important}
.modal{
  background:#fff !important;
  border:1px solid var(--line) !important;
  color:var(--navy) !important;
  box-shadow:0 20px 60px rgba(147,29,79,.22) !important;
}
.toast{
  background:var(--hot-pink) !important;
  color:#fff !important;
  box-shadow:var(--shadow) !important;
}
.toast.error{background:var(--danger) !important}

/* Weekly schedule — same attached pink/navy palette */
.calendar-wrap{
  background:#fff !important;
  border:1px solid var(--line) !important;
  border-radius:18px;
}
.calendar{
  border:1px solid var(--line) !important;
  border-radius:14px;
  background:#fff !important;
}
.cal-head{
  background:var(--hot-pink) !important;
  color:#fff !important;
  border-right:1px solid #d80f5d !important;

  box-shadow:0 2px 0 #d80f5d !important;
  font-weight:900;
}
.cal-head *{color:inherit !important}
.time-label{

/* Safe migration from the previous Teacher Lois version */
(function migratePreviousBrandingData(){
  const migrations = [
    ["teacher_shine_dashboard_v1", "teacher_marc_dashboard_v1"],

      if(localStorage.getItem(newKey)===null){

const state=loadState();

function normalizeClassRecordIds(records){
  const used=new Set();
  return records.map((r,i)=>{
    const rec=(r&&typeof r==="object")?r:{};
    let id=String(rec.id||"");
    if(!id||used.has(id)){
      id=uid("record");
      while(used.has(id))id=uid("record");
    }
    used.add(id);
    if(!rec.createdAt)rec.createdAt=Date.now()+i;
    rec.id=id;
    return rec;
  });
}
function loadState(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY)||"null");
    return x&&typeof x==="object"?{
      students:Array.isArray(x.students)?x.students:[],
      weeklySchedules:Array.isArray(x.weeklySchedules)?x.weeklySchedules:[],

      contracts:Array.isArray(x.contracts)?x.contracts:[],
      payments:Array.isArray(x.payments)?x.payments:[],
      classRecords:normalizeClassRecordIds(Array.isArray(x.classRecords)?x.classRecords:[])
    }:{students:[],weeklySchedules:[],singleDaySchedules:[],contracts:[],payments:[],classRecords:[]};
  }catch(e){return {students:[],weeklySchedules:[],singleDaySchedules:[],contracts:[],payments:[],classRecords:[]}}
}

function uid(p){return p+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7)}

function student(id){return state.students.find(x=>x.id===id)}

function select(label,name,options,selected){return `<label>${esc(label)}<select class="field" name="${esc(name)}">${options.map(x=>`<option value="${esc(x)}" ${String(x)===String(selected)?"selected":""}>${esc(x)}</option>`).join("")}</select></label>`}
function opts(selected=""){return `<option value="">Select student</option>`+state.students.map(x=>`<option value="${esc(x.id)}" ${x.id===selected?"selected":""}>${esc(x.name)}${x.studentCode?" · "+esc(x.studentCode):""}</option>`).join("")}

function timezoneOptions(sel){
  const common=["Asia/Manila","Europe/Warsaw","Europe/London","Europe/Paris","Europe/Berlin","America/New_York","America/Los_Angeles","America/Toronto","Asia/Tokyo","Asia/Seoul","Asia/Singapore","Australia/Sydney"];
  let zones=common;
  try{if(Intl.supportedValuesOf){zones=[...new Set([...common,...Intl.supportedValuesOf("timeZone")])]}}catch(e){}
  if(sel&&!zones.includes(sel))zones.unshift(sel);
  return zones.map(z=>`<option value="${esc(z)}" ${z===sel?"selected":""}>${esc(z)}</option>`).join("")
}

/* timezone conversion */
function partsFor(date,tz){
  const p=new Intl.DateTimeFormat("en-US",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(date);
  const o={};p.forEach(x=>o[x.type]=x.value);return o
}
function zonedLocalToDate(dateStr,timeStr,tz){
  const [y,m,d]=String(dateStr).split("-").map(Number),[hh,mm]=String(timeStr).split(":").map(Number);
  if(!y||!m||!d||Number.isNaN(hh)||Number.isNaN(mm))return null;
  let guess=Date.UTC(y,m-1,d,hh,mm);
  for(let i=0;i<3;i++){
    const p=partsFor(new Date(guess),tz);
    const actual=Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute);
    const desired=Date.UTC(y,m-1,d,hh,mm);
    guess+=desired-actual;
  }
  return new Date(guess)
}
function convertStudentDateTimeToPhilippines(date,time,tz){
  const instant=zonedLocalToDate(date,time,tz); if(!instant)return null;
  const p=partsFor(instant,PH);
  const dt=`${p.year}-${p.month}-${p.day}`;
  const day=new Intl.DateTimeFormat("en-US",{timeZone:PH,weekday:"long"}).format(instant);
  return {philippinesDate:dt,philippinesTime:`${p.hour}:${p.minute}`,philippinesDay:day,studentLocalDate:date,studentLocalTime:time,instant}
}
function weekday(date,tz=PH){return new Intl.DateTimeFormat("en-US",{timeZone:tz,weekday:"long"}).format(date)}
function monday(offset=0){
  const now=new Date(), p=partsFor(now,PH);
  const noon=zonedLocalToDate(`${p.year}-${p.month}-${p.day}`,"12:00",PH);
  const day=new Date(noon), wd=day.getUTCDay(); day.setUTCDate(day.getUTCDate()-(wd===0?6:wd-1)+offset*7); return day
}
function dateStr(d){return partsFor(d,PH).year+"-"+partsFor(d,PH).month+"-"+partsFor(d,PH).day}
function weeklyOccurrenceForWeek(x,start){
  const days=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],wanted=days.indexOf(x.studentLocalDay);if(wanted<0)return null;
  for(let i=0;i<7;i++){let d=new Date(start.getTime());d.setUTCDate(d.getUTCDate()+i);if(weekday(d,PH)===x.studentLocalDay){
    const localDate=fmtInZone(d,x.studentTimezone||"Asia/Manila");
    const conv=convertStudentDateTimeToPhilippines(localDate,x.studentLocalTime,x.studentTimezone||"Asia/Manila");
    if(conv)return {...conv,id:x.id,duration:Number(x.duration||25)}
  }}return null
}
function fmtInZone(d,tz){const p=partsFor(d,tz);return `${p.year}-${p.month}-${p.day}`}
function scheduleInstant(x){return zonedLocalToDate(x.philippinesDate,x.philippinesTime,PH)}
function overlap(a,durA,b,durB){return a&&b&&a<b.getTime()+durB*60000&&b<a.getTime()+durA*60000}
function classDateForContract(x){return String(x?.phDate||x?.philippinesDate||x?.studentLocalDate||"").slice(0,10)}
function dateWithinContract(d,c){d=String(d||"").slice(0,10);let s=String(c?.startDate||"").slice(0,10),e=String(c?.endDate||"").slice(0,10);return !!(d&&s&&e&&d>=s&&d<=e)}
function weeklyOccurrenceDate(x){return x&&x.studentLocalDay?weeklyOccurrenceForWeek(x,monday(weekOffset))?.philippinesDate||"":""}
function getClassStatus(x,occurrenceDate=""){
  if(x&&x.studentLocalDay){const d=occurrenceDate||x._occurrenceDate||weeklyOccurrenceDate(x);if(d&&x.statusByDate&&x.statusByDate[d])return x.statusByDate[d];}
  return x?.status||x?.classStatus||"Scheduled";
}
function isPresent(s){return s==="Present"}
function allBookedClasses(){return [...state.weeklySchedules,...state.singleDaySchedules]}
function contractForStudent(id,date=""){
  const cs=state.contracts.filter(c=>c.studentId===id).sort((a,b)=>String(a.startDate).localeCompare(String(b.startDate)));
  return date?cs.find(c=>dateWithinContract(date,c))||null:cs.find(c=>c.status!=="Completed")||cs.at(-1)||null
}
function weeklyScheduleWithinContract(x,date){
  const s=student(x?.studentId);
  if(!s || s.paymentType!=="Contract") return true;
  return !!contractForStudent(x.studentId,date);
}
function recalculateContracts(){
  state.contracts.forEach(c=>{
    const records=state.classRecords.filter(r=>r.studentId===c.studentId&&isPresent(r.status)&&dateWithinContract(classDateForContract(r),c));
    const recordedScheduleKeys=new Set(records.map(r=>String(r.sourceScheduleKey||"" )).filter(Boolean));
    const booked=allBookedClasses().filter(x=>x.studentId===c.studentId&&isPresent(getClassStatus(x))&&dateWithinContract(classDateForContract(x),c));
    const bookedOnly=booked.filter(x=>!recordedScheduleKeys.has(scheduleOccurrenceKey(x)));
    c.total=Number(c.total)||0;c.used=records.length+bookedOnly.length;c.status=c.used>=c.total?"Completed":"Active";
  })
}
function checkConflict(candidate,id,type){
  const start=scheduleInstant(candidate);if(!start)return true;
  for(const x of state.weeklySchedules){if(x.id===id)continue;const conv=weeklyOccurrenceForWeek(x,monday(weekOffset));if(!conv)continue;if(conv.philippinesDate!==candidate.philippinesDate)continue;if(overlap(start,Number(candidate.duration),scheduleInstant(conv),Number(x.duration)))return true}
  for(const x of state.singleDaySchedules){if(x.id===id)continue;if(x.philippinesDate!==candidate.philippinesDate)continue;if(overlap(start,Number(candidate.duration),scheduleInstant(x),Number(x.duration)))return true}
  return false
}

/* teacher photo */
function applyTeacherPhoto(src){

}
function saveTeacherPhoto(src){
  try{localStorage.setItem(PHOTO_KEY,src);applyTeacherPhoto(src);return true}
  catch(e){
    try{
      const img=new Image();img.onload=()=>{
        const c=document.createElement("canvas"),max=700;
        const ratio=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
        c.width=Math.max(1,Math.round(img.naturalWidth*ratio));c.height=Math.max(1,Math.round(img.naturalHeight*ratio));
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        try{const compact=c.toDataURL("image/jpeg",.72);localStorage.setItem(PHOTO_KEY,compact);applyTeacherPhoto(compact);toast("Teacher photo saved for future browser sessions.")}catch(err){toast("SAVE FAILED: Browser storage is full. Please use a smaller photo.","error")}};
      img.src=src;
    }catch(err){toast("SAVE FAILED: The photo could not be saved.","error")}
    return false;
  }

function setView(nextView){

function captureUiScroll(){
  const wrap=document.querySelector(".calendar-wrap");
  return {pageX:window.scrollX,pageY:window.scrollY,wrapTop:wrap?wrap.scrollTop:0,wrapLeft:wrap?wrap.scrollLeft:0};
}
function restoreUiScroll(pos){
  if(!pos)return;
  const apply=()=>{
    window.scrollTo({left:pos.pageX,top:pos.pageY,behavior:"instant"});
    const wrap=document.querySelector(".calendar-wrap");
    if(wrap){wrap.scrollTop=pos.wrapTop;wrap.scrollLeft=pos.wrapLeft;}
  };
  apply();
  requestAnimationFrame(()=>{apply();requestAnimationFrame(apply);});
  setTimeout(apply,50);
  setTimeout(apply,150);
}
function render(){
  const scrollPos=captureUiScroll();
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===view));
  document.getElementById("main").innerHTML=({dashboard,students,schedule,contracts,payments,records,reports,profile}[view]||dashboard)();
  if(view==="profile"&&selectedStudent)applyStudentPhoto(selectedStudent,localStorage.getItem("teacher_marc_student_photo_"+selectedStudent)||"");
  restoreUiScroll(scrollPos);
}

     ].map(x=>`<article class="stat stat-${esc(x[3])}"><span class="stat-icon">${esc(x[2])}</span><div><span>${esc(x[0])}</span><b>${esc(x[1])}</b></div></article>`).join("")}</section>

       <span class="badge">${todayRows().length} class${todayRows().length===1?"":"es"}</span>
     </div>
     ${todayRowsHtml()}
   </section>
   </div>`
}
function todayRows(){
  const today=todayPH(),arr=[];
  state.singleDaySchedules.filter(x=>x.philippinesDate===today).forEach(x=>arr.push(x));
  state.weeklySchedules.forEach(x=>{const c=weeklyOccurrenceForWeek(x,monday(0));if(c?.philippinesDate===today)arr.push({...x,...c,weekly:true})});
  return arr.sort((a,b)=>String(a.philippinesTime).localeCompare(String(b.philippinesTime)))
}
function todayRowsHtml(){
  const a=todayRows();
  return a.length?`<div class="table"><table class="today-table"><thead><tr>
    <th>Time</th><th>Student</th><th>Duration</th><th>Type</th><th>Status</th><th>Book / Lesson</th>
  </tr></thead><tbody>${a.map(x=>{
    const s=student(x.studentId)||{};
    const status=getClassStatus(x);
    const statusClass=statusClassName(status).replace(/^status-/,"");
    /*
       Today's Classes must carry forward the learner's most recently updated
       book / lesson / page.  The previous logic only looked for a record on
       today's exact date, which caused an older update (for example Filip's
       September 25 lesson update) to disappear from today's dashboard.

       Use the latest saved class record for this student whose Philippines
       date is on or before the date being displayed.  If several records are
       on the same date, use time first and createdAt as the final tie-breaker.
    */
    const displayDate=String(x.philippinesDate||todayPH());
    const priorRecords=state.classRecords
      .filter(r=>String(r.studentId||"")===String(x.studentId||"") && String(r.phDate||"") && String(r.phDate||"")<=displayDate)
      .sort((a,b)=>{
        const ad=String(a.phDate||"");
        const bd=String(b.phDate||"");
        if(ad!==bd)return bd.localeCompare(ad);
        const at=String(a.phTime||"");
        const bt=String(b.phTime||"");
        if(at!==bt)return bt.localeCompare(at);
        return Number(b.createdAt||0)-Number(a.createdAt||0);
      });
    /*
       Resolve each lesson field from the newest non-empty update on or before
       the class date. This keeps an older book/lesson/page when a newer record
       did not change that particular field.
    */
    const latestValue=(field,fallback="")=>{
      const found=priorRecords.find(r=>String(r[field]??"").trim()!=="");
      return found?String(found[field]).trim():String(fallback??"");
    };
    const book=latestValue("book",x.book||s.book||"");
    const lessonValue=latestValue("lesson",x.lesson||s.currentLesson||"");
    const page=latestValue("page",x.page||s.currentPage||"");
    const lesson=[book,lessonValue,page?`Page ${page}`:""].filter(Boolean).join(" / ");
    return `<tr><td>${esc(x.philippinesTime)}</td><td><b>${esc(s.name||nameOf(x.studentId))}</b></td><td>${esc(x.duration)} min</td><td>${esc(s.paymentType||"—")}</td><td><span class="status-pill ${statusClass}">${esc(status==="Present"?"Completed":status)}</span></td><td>${esc(lesson||"—")}</td></tr>`;
  }).join("")}</tbody></table></div>`:`<div class="empty">No classes scheduled for today.</div>`
}
function weekClassCount(){const s=monday(weekOffset),e=new Date(s);e.setUTCDate(e.getUTCDate()+6);let n=0;state.weeklySchedules.forEach(x=>{if(weeklyOccurrenceForWeek(x,s))n++});state.singleDaySchedules.forEach(x=>{if(x.philippinesDate>=dateStr(s)&&x.philippinesDate<=dateStr(e))n++});return n}

/* schedule */
function schedule(){
 const start=monday(weekOffset),days=Array.from({length:7},(_,i)=>{const d=new Date(start);d.setUTCDate(d.getUTCDate()+i);return d});
 const nowParts=new Intl.DateTimeFormat("en-CA",{timeZone:PH,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date()).reduce((o,p)=>(o[p.type]=p.value,o),{});
 const nowDate=`${nowParts.year}-${nowParts.month}-${nowParts.day}`;
 const nowMinutes=Number(nowParts.minute);
 const nowTime=`${String(Number(nowParts.hour)).padStart(2,"0")}:${nowMinutes<30?"00":"30"}`;
 let g=`<div class="calendar"><div class="cal-head">PH Time</div>`+days.map(d=>{const pd=dateStr(d);return `<div class="cal-head${pd===nowDate?" current-day":""}">${esc(weekday(d))}<br>${esc(fmtDate(d).slice(5))}${pd===nowDate?"<br><small>Today</small>":""}</div>`}).join("");
 const weekly=state.weeklySchedules.map(x=>({x,conv:weeklyOccurrenceForWeek(x,start)})).filter(a=>a.conv&&weeklyScheduleWithinContract(a.x,a.conv.philippinesDate));
 for(let row=0;row<48;row++){const time=String(Math.floor(row/2)).padStart(2,"0")+(row%2?":30":":00");const displayTime=(h=>{const [hh,mm]=h.split(":").map(Number);const suffix=hh>=12?"PM":"AM";const hour=hh%12||12;return `${hour}:${String(mm).padStart(2,"0")} ${suffix}`;})(time);g+=`<div class="time-label${time===nowTime?" current-time":""}">${displayTime}${time===nowTime?"<br><small>Current</small>":""}</div>`+days.map(d=>{const pd=dateStr(d),day=weekday(d);const ww=weekly.filter(a=>a.conv.philippinesDate===pd&&a.conv.philippinesTime===time).map(a=>({...a.x,_occurrenceDate:pd})),ss=state.singleDaySchedules.filter(x=>x.philippinesDate===pd&&x.philippinesTime===time);const closed=isSlotClosed(pd,time);const currentSlot=pd===nowDate&&time===nowTime;return `<div class="cell${closed?" slot-closed":""}${currentSlot?" current-slot":""}">${slotControls(pd,time)}${calendarEvents(ww,"weekly")}${calendarEvents(ss,"single")}</div>`}).join("")}g+="</div>";
 const ws=new Intl.DateTimeFormat("en-US",{timeZone:PH,month:"long",day:"numeric",year:"numeric"}).format(start),we=new Intl.DateTimeFormat("en-US",{timeZone:PH,month:"long",day:"numeric",year:"numeric"}).format(days[6]);
 return header("Weekly Schedule",`Week of ${ws} – ${we} · Philippines time · Asia/Manila`)+`<section class="panel"><div class="toolbar"><div class="left"><button class="ghost" onclick="weekOffset--;render()">Previous Week</button><button class="secondary" onclick="weekOffset=0;render()">Today</button><button class="ghost" onclick="weekOffset++;render()">Next Week</button></div><button class="primary" onclick="classChoice()">+ Add Class</button></div><div class="calendar-wrap">${g}</div></section>`

/* records */
function findClassRecordIndex(id){
  if(!id)return -1;
  return state.classRecords.findIndex(r=>String(r.id)===String(id));
}
function orderedClassRecords(){
  return [...state.classRecords].sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0));
}
/* Central monthly-payment link: Records and Reports always derive their status from the live Payments data for the same student and YYYY-MM month. */
function monthlyPaymentRows(ym){return state.students.filter(s=>s.paymentType==="Monthly").map(s=>{const records=state.classRecords.filter(r=>r.studentId===s.id&&String(r.phDate||"").slice(0,7)===ym&&isPresent(r.status));const booked=allBookedClasses().filter(x=>x.studentId===s.id&&isPresent(getClassStatus(x))&&classDateForContract(x).slice(0,7)===ym);const ids=new Set(records.map(r=>String(r.id||"")));const payable=records.length+booked.filter(x=>!ids.has(String(x.id||""))).length;const rate=Number(s.rate||0);const expected=Math.round(payable*rate*100)/100;const monthlyPayments=state.payments.filter(p=>p.studentId===s.id&&String(p.date||"").slice(0,7)===ym&&String(p.type||"").toLowerCase()==="monthly");const paid=monthlyPayments.filter(p=>String(p.status||"").toLowerCase()==="paid").reduce((a,p)=>a+Number(p.amount||0),0);const status=monthlyPaymentStatus(s.id,ym);return {s,payable,rate,expected,paid,extraPaid:extraPaidAmount(paid,expected),outstanding:Math.max(0,Math.round((expected-paid)*100)/100),status}})}
function studentConductedClasses(studentId){
 const seen=new Set();
 const add=(date,time,duration)=>{const key=[studentId,date||"",time||"",duration||25].join("|");if(!seen.has(key))seen.add(key)};
 state.classRecords.filter(r=>r.studentId===studentId&&isPresent(r.status)).forEach(r=>add(r.phDate,r.phTime,r.duration));
 allBookedClasses().filter(x=>x.studentId===studentId&&isPresent(getClassStatus(x))).forEach(x=>add(classDateForContract(x),x.philippinesTime,x.duration));
 return seen.size;
}

function recordForm(id=""){
  const idx=id?findClassRecordIndex(id):-1;
  if(id&&idx<0){toast("Class record not found.","error");return}
  const x=id?state.classRecords[idx]:{studentId:"",phDate:todayPH(),phTime:"09:00",duration:"25",book:"",lesson:"",page:"",status:"Scheduled",note:""};
  modal(id?"Edit Class Record":"Add Class Record",`<form onsubmit="saveRecord(event,'${id}')"><div class="grid"><label class="full">Student<select class="field" name="studentId" required>${opts(x.studentId)}</select></label>${input("Philippines Date","phDate",x.phDate,true,"date")}${input("Philippines Time","phTime",x.phTime,true,"time")}${select("Duration","duration",["25","50"],String(x.duration))}${input("Book","book",x.book)}${input("Lesson","lesson",x.lesson)}${input("Page","page",x.page)}${select("Status","status",RECORD_STATUSES,x.status)}<label class="full">Class Note<textarea class="field" name="note">${esc(x.note)}</textarea></label></div><div class="modal-actions"><button type="button" class="ghost" onclick="closeModal()">Cancel</button><button class="primary">Save Class Record</button></div></form>`)}
function saveRecord(e,id){
  e.preventDefault();
  const d=formData(e.target);
  d.duration=+d.duration||25;
  if(id){
    const idx=findClassRecordIndex(id);
    if(idx<0){toast("SAVE FAILED: The selected class record no longer exists.","error");return}
    const existing=state.classRecords[idx];
    d.id=existing.id;
    d.createdAt=existing.createdAt||Date.now();
    state.classRecords[idx]={...existing,...d};
    // Keep the linked schedule's individual book, lesson, and page in sync.
    if(existing.sourceScheduleId){
      const sourceList=existing.sourceScheduleType==="weekly"?state.weeklySchedules:existing.sourceScheduleType==="single"?state.singleDaySchedules:null;
      const source=sourceList?.find(x=>String(x.id)===String(existing.sourceScheduleId));
      if(source){source.book=d.book||"";source.lesson=d.lesson||"";source.page=d.page||"";source.note=d.note||source.note||"";}
    }
  }else{
    d.id=uid("record");
    d.createdAt=Date.now();
    state.classRecords.unshift(d);
  }
  recalculateContracts();
  persist();
  closeModal();
  render();
  toast(id?"Class record updated.":"Class record added.");
}

/* delete */
function confirmDelete(type,id){const labels={weekly:"weekly schedule",single:"single-day class",student:"student",contract:"contract",payment:"payment record",record:"class record"};modal("Confirm Delete",`<p>Are you sure you want to delete this ${esc(labels[type]||"record")}?</p><div class="modal-actions"><button class="ghost" onclick="closeModal()">Cancel</button><button class="danger" onclick="deleteItem('${type}','${id}')">Delete</button></div>`)}
function deleteItem(type,id){const map={weeklySchedules:"weekly",singleDaySchedules:"single",contracts:"contract",payments:"payment",classRecords:"record"};if(type==="student"){state.students=state.students.filter(x=>x.id!==id);["weeklySchedules","singleDaySchedules","contracts","payments","classRecords"].forEach(k=>state[k]=state[k].filter(x=>x.studentId!==id));localStorage.removeItem("teacher_marc_student_photo_"+id);view="students"}else{const k=Object.keys(map).find(k=>map[k]===type);if(k)state[k]=state[k].filter(x=>x.id!==id)}recalculateContracts();persist();closeModal();render();toast("Record successfully deleted.")}

const oldTeacherPhoto=localStorage.getItem(PHOTO_KEY);if(oldTeacherPhoto)applyTeacherPhoto(oldTeacherPhoto);
recalculateContracts();persist();render();
